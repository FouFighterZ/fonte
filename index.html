<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0F">
<meta name="description" content="Carnet de musculation : séances, programmes, records et transformations.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fonte">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fonte Musculation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen mobile app — ink hero with a plate-ring motif, scrolling cards, floating rest strip and floating tab bar; sheets slide up. Identity: competition-plate colours code the muscle groups. */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface2:#EBEDF2; --fg:#0F1117; --muted:#626A7A; --line:#E0E3EA;
  --accent:#F0432A; --accent2:#FF8A3D; --accent-fg:#FFFFFF; --accent-soft:#FDE3DE;
  --pr:#E0700B; --pr-soft:#FDEBD8; --good:#12935A; --good-soft:#D9F2E5; --danger:#D23A3A; --danger-soft:#FADFDF;
  --hero:#12141B; --hero-fg:#F5F6FA; --hero-muted:#A3A9B8; --hero-line:rgba(255,255,255,.09);
  --scrim:rgba(10,12,18,.5); --shadow:0 12px 32px rgba(15,17,23,.12); --shadow-sm:0 1px 2px rgba(15,17,23,.06),0 4px 14px rgba(15,17,23,.05);
  --glass:rgba(255,255,255,.82); --fig:#1A1D26; --prop:#A1A7B4; --mm:#DCE0E7;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0B0F; --surface:#15171D; --surface2:#1F222A; --fg:#F1F2F6; --muted:#9097A6; --line:#262A33;
  --accent:#FF5236; --accent2:#FF9A4D; --accent-fg:#FFFFFF; --accent-soft:#3A1912;
  --pr:#FFA040; --pr-soft:#3A2512; --good:#36D08A; --good-soft:#10301F; --danger:#FF6B6B; --danger-soft:#3A1717;
  --hero:#16181F; --hero-fg:#F5F6FA; --hero-muted:#9EA4B3; --hero-line:rgba(255,255,255,.07);
  --scrim:rgba(0,0,0,.65); --shadow:0 12px 32px rgba(0,0,0,.55); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --glass:rgba(21,23,29,.82); --fig:#E9ECF2; --prop:#5F6676; --mm:#2A2F3A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A0B0F; --surface:#15171D; --surface2:#1F222A; --fg:#F1F2F6; --muted:#9097A6; --line:#262A33;
  --accent:#FF5236; --accent2:#FF9A4D; --accent-fg:#FFFFFF; --accent-soft:#3A1912;
  --pr:#FFA040; --pr-soft:#3A2512; --good:#36D08A; --good-soft:#10301F; --danger:#FF6B6B; --danger-soft:#3A1717;
  --hero:#16181F; --hero-fg:#F5F6FA; --hero-muted:#9EA4B3; --hero-line:rgba(255,255,255,.07);
  --scrim:rgba(0,0,0,.65); --shadow:0 12px 32px rgba(0,0,0,.55); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --glass:rgba(21,23,29,.82); --fig:#E9ECF2; --prop:#5F6676; --mm:#2A2F3A; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:600px){ #app{border-inline:1px solid var(--line)} }
#main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:6px 24px;display:flex;flex-direction:column;gap:20px}
.wrap.anim > *{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.wrap.anim > *:nth-child(2){animation-delay:.03s}.wrap.anim > *:nth-child(3){animation-delay:.06s}.wrap.anim > *:nth-child(4){animation-delay:.09s}.wrap.anim > *:nth-child(5){animation-delay:.12s}.wrap.anim > *:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}

/* Type */
.h1{font-family:var(--f-display);font-weight:700;font-style:italic;font-size:38px;line-height:.95;letter-spacing:-.2px;text-transform:uppercase;margin:0;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05;text-transform:uppercase;letter-spacing:.3px;margin:0}
.h3{font-weight:700;font-size:16px;margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:700}
.tab{font-variant-numeric:tabular-nums}

/* Top bar */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:16px}
.top .sub{font-size:12px;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-sm);border:1px solid var(--line);flex:none;transition:transform .12s}
.iconbtn svg{width:20px;height:20px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--hero);color:var(--hero-fg);padding:18px 18px 16px;display:flex;flex-direction:column;gap:16px;isolation:isolate;margin-top:12px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;z-index:-1;background:repeating-radial-gradient(circle at center, transparent 0 18px, var(--hero-line) 18px 19px)}
.hero::after{content:"";position:absolute;left:-70px;bottom:-130px;width:300px;height:300px;border-radius:50%;z-index:-1;background:radial-gradient(circle, color-mix(in srgb, var(--accent) 50%, transparent), transparent 70%);opacity:.55}
.hero .h1{font-size:40px;color:var(--hero-fg)}
.hero .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;font-weight:700;color:var(--accent2)}
.hero .msg{color:var(--hero-muted);font-size:14.5px;margin:0;max-width:30ch}
.hero .msg b{color:var(--hero-fg)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-top .iconbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:var(--hero-fg);box-shadow:none}
.hero-top .sync{color:var(--hero-muted)}
.hero-main{display:flex;align-items:center;gap:14px}
.hero-main > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:700}
.ring .in b small{font-size:18px;color:var(--hero-muted)}
.ring .in span{font-size:10.5px;color:var(--hero-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.ring .arc{animation:arc 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes arc{from{stroke-dashoffset:var(--c)}}
.hero .week .day{background:rgba(255,255,255,.06);border-color:transparent;color:var(--hero-fg)}
.hero .week .day .d{color:var(--hero-muted)}
.hero .week .day.today:not(.done){border-color:rgba(255,255,255,.55)}
.hero .btn.primary{box-shadow:0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent)}
.hero .row .btn{min-width:0;flex-shrink:1;padding:0 14px}
.hero .row .btn.xl{font-size:16px;overflow:hidden;text-overflow:ellipsis}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link{color:var(--accent);font-weight:700;font-size:14px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--surface2);color:var(--fg);white-space:nowrap;transition:transform .12s}
.btn.primary{background:linear-gradient(135deg, var(--accent), var(--accent2));color:var(--accent-fg)}
.btn.good{background:var(--good);color:#fff}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.hero .btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:var(--hero-fg)}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn.xl{height:58px;font-size:17px;border-radius:18px;letter-spacing:.2px}
.btn svg{width:18px;height:18px}
.btn:active,.iconbtn:active,.li:active,.wcard:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Chips & segmented */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r));padding-inline:var(--gut-l) var(--gut-r)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--h)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;height:36px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);padding:0 8px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.5px;background:var(--surface2);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.pill.pr{background:var(--pr-soft);color:var(--pr)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* Inputs */
.field{display:flex;flex-direction:column;gap:6px}
.inp{height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:0 13px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:74px;padding:11px 13px;resize:vertical}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:11px;background:var(--surface2);font-weight:700;font-size:18px}
.stepper .v{min-width:44px;text-align:center}
.toggle{width:50px;height:30px;border-radius:999px;background:var(--surface2);position:relative;flex:none;border:1px solid var(--line)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on::after{transform:translateX(20px);background:#fff}

/* Home */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 9px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.day .d{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day .n{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.week .day.done{background:linear-gradient(160deg, var(--accent), var(--accent2));border-color:transparent;color:#fff}
.week .day.done .d{color:#fff;opacity:.85}
.week .day.done .dot{background:#fff}
.day.today:not(.done){border-color:var(--fg)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:5px;min-width:0;box-shadow:var(--shadow-sm)}
.stat .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb, var(--h, var(--accent)) 16%, transparent);color:var(--h, var(--accent));margin-bottom:2px}
.stat .ic svg{width:17px;height:17px}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.meter{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg, var(--accent), var(--accent2));border-radius:9px}
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg, var(--good), color-mix(in srgb, var(--good) 65%, #08a));color:#fff;border-radius:var(--r);padding:15px 16px;width:100%;text-align:left;box-shadow:0 10px 26px color-mix(in srgb, var(--good) 35%, transparent)}
.banner .pulse{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .plate{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:repeating-radial-gradient(circle, color-mix(in srgb, var(--accent) 80%, transparent) 0 3px, transparent 3px 9px)}
.empty .plate i{width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 4px var(--accent)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%;transition:transform .12s, background .12s}
.li:first-child{border-top:0}
button.li:hover{background:color-mix(in srgb, var(--surface2) 50%, transparent)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:30px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--surface2);font-size:12px;font-weight:800;color:var(--muted);padding:0 7px}
.mus{--h:var(--accent);width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.3px;flex:none;background:color-mix(in srgb, var(--h) 17%, transparent);color:color-mix(in srgb, var(--h) 78%, var(--fg))}
.mus.on{background:var(--accent);color:#fff}
.mdots{display:flex;gap:5px;flex-wrap:wrap}
.mdots span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:999px;padding:3px 9px 3px 7px}
.mdots i{width:8px;height:8px;border-radius:50%;background:var(--h)}
.chev{color:var(--muted);flex:none}
.wcard{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;transition:transform .12s}
.wcard .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.wcard .meta b{color:var(--fg);font-weight:700;font-family:var(--f-display);font-size:17px;margin-right:2px}
.wdate{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:50px;border-radius:13px;background:var(--surface2);flex:none}
.wdate b{font-family:var(--f-display);font-size:22px;line-height:1}
.wdate span{font-size:10px;text-transform:uppercase;font-weight:800;color:var(--muted);letter-spacing:.6px}
.exlines{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.exlines span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard{position:relative;overflow:hidden;padding-top:20px}
.rcard .stripe{position:absolute;left:0;top:0;right:0;height:5px;display:flex}
.rcard .stripe i{flex:1;background:var(--h)}
.tcard{display:flex;flex-direction:column;gap:10px;min-width:0}

/* Workout */
.wk-head{display:flex;flex-direction:column;gap:12px;background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:16px 16px 14px;margin-top:12px;position:relative;overflow:hidden;isolation:isolate;box-shadow:var(--shadow)}
.wk-head::before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;z-index:-1;background:repeating-radial-gradient(circle, transparent 0 14px, var(--hero-line) 14px 15px)}
.wk-head .lbl{color:var(--hero-muted)}
.wk-name{font-family:var(--f-display);font-size:30px;font-weight:700;font-style:italic;text-transform:uppercase;background:transparent;border:0;padding:0;width:100%;min-width:0;color:var(--hero-fg)}
.wk-name:focus{outline:none;box-shadow:0 2px 0 var(--accent)}
.clock{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.wk-prog{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.wk-prog i{display:block;height:100%;background:linear-gradient(90deg, var(--accent), var(--accent2));border-radius:9px;transition:width .4s}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 10px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-sm)}
.exc-h{display:flex;align-items:center;gap:10px;padding:0 4px}
.exc-h .mus{width:34px;height:34px;border-radius:11px;font-size:12px}
.exc-h .nm{flex:1;min-width:0;text-align:left;font-weight:700;font-size:16px;line-height:1.2}
.exc-note{font-size:13px;color:var(--muted);padding:0 4px;white-space:pre-wrap}
.sets{display:grid;grid-template-columns:34px minmax(0,1fr) 64px 56px 40px 26px;gap:6px;align-items:center}
.sets .hd{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);text-align:center}
.sets .hd.l{text-align:left;padding-left:4px}
.sets .cell{height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.stype{height:32px;width:32px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:16px;font-family:var(--f-display)}
.stype.w{color:var(--pr);background:var(--pr-soft)}
.stype.d{color:#3D7BFF;background:color-mix(in srgb, #3D7BFF 15%, transparent)}
.stype.f{color:var(--danger);background:var(--danger-soft)}
.prev{font-size:13px;color:var(--muted);justify-content:flex-start!important;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sinp{height:40px;width:100%;min-width:0;border-radius:10px;border:1.5px solid transparent;background:var(--surface2);text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;padding:0 4px;transition:background .2s}

// Animated figure loop for the open exercise sheet
let figRAF = 0;
function startFigAnim(){
  cancelAnimationFrame(figRAF);
  const t0 = performance.now();
  const step = now => {
    const el = document.getElementById('figAnim');
    if (!el) return;
    const ph = ((now - t0) / 3200) % 1;
    const k = ph < .15 ? 0 : ph < .5 ? (ph - .15)/.35 : ph < .65 ? 1 : 1 - (ph - .65)/.35;
    el.innerHTML = figInner(exById(el.dataset.ex), (1 - Math.cos(Math.PI*k))/2);
    figRAF = requestAnimationFrame(step);
  };
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  figRAF = requestAnimationFrame(step);
}

  fail(e){

    if (c === 'quota_exceeded') return toast('Stockage plein : supprimez d’anciennes séances pour continuer à sauvegarder en ligne.');
    if (c === 'unavailable' || c === 'resource_exhausted') return toast('Synchronisation retardée. Vos données sont gardées sur cet appareil.');
    this.mode = 'local'; setSync();
    toast('Sauvegarde en ligne impossible : vos données restent sur cet appareil.');
  }
};
function save(){ Store.saveProfile(); }
function setSync(){ const el = $('#syncState'); if (el) el.outerHTML = syncHtml(); }
function syncHtml(){ return Store.mode === 'db' ? '<span id="syncState" class="sync cloud"><i></i>Synchronisé</span>' : '<span id="syncState" class="sync"><i></i>Sur cet appareil</span>'; }

/* ---------- Data queries ---------- */
function allEx(){ return EX.concat(S.customEx); }
function exById(id){ return EX.find(e => e.id === id) || S.customEx.find(e => e.id === id) || {id, name:'Exercice supprimé', muscle:'Autre', equip:'', kind:'wr'}; }
function exHistory(exId){
  const out = [];
  for (const w of S.workouts) for (const e of w.exercises) if (e.exId === exId) out.push({w, sets:e.sets});
  return out; // newest first
}
function prevSets(exId){ const h = exHistory(exId); return h.length ? h[0].sets : null; }
function bestOf(exId, excludeId){
  let b = {e1:0, w:0, r:0, t:0};
  for (const w of S.workouts) { if (w.id === excludeId) continue;
    for (const e of w.exercises) if (e.exId === exId) for (const s of e.sets) { if (!isWork(s)) continue;
      const v = e1rm(s.w, s.r); if (v > b.e1) b.e1 = v; if ((s.w||0) > b.w) b.w = s.w; if ((s.r||0) > b.r) b.r = s.r; } }
  return b;
}
function exCount(){ const m = {}; for (const w of S.workouts) for (const e of w.exercises) m[e.exId] = (m[e.exId]||0) + 1; return m; }

function streak(){

function exCard(e, ei){
  const ex = exById(e.exId), prev = prevSets(e.exId) || [], best = bestOf(e.exId, S.active.id);
  const kind = ex.kind;
  const noW = ex.muscle === 'Cardio';
  const wHead = noW ? '' : (kind === 'wr' ? 'Charge' : 'Lest');
  const rHead = kind === 'time' ? 'Sec' : 'Reps';
  let n = 0;
  const rows = e.sets.map((s, si) => {
    const label = s.t === 'w' ? 'É' : s.t === 'd' ? 'D' : s.t === 'f' ? 'X' : String(++n);
    const p = prev[si] || null;
    const pTxt = p ? (kind === 'time' ? (p.w ? nf.format(dispW(p.w)) + ' · ' : '') + fmtSec(p.r||0) : (kind === 'bw' && !p.w ? (p.r||0) + ' reps' : nf.format(dispW(p.w)||0) + ' × ' + (p.r||0))) : '—';
    const isPr = s.done && isWork(s) && kind !== 'time' && best.e1 > 0 && e1rm(s.w, s.r) > best.e1 + 0.01;
    const phW = p && p.w ? dispW(p.w) : (noW ? '' : unit());
    const phR = p && p.r ? p.r : (parseInt(e.target) || '');
    return `<div class="cell"><button class="stype ${s.t}" data-a="setType" data-e="${ei}" data-s="${si}" aria-label="Type de série">${label}</button></div>
      <div class="cell prev" ${p?`data-a="usePrev" data-e="${ei}" data-s="${si}"`:''}>${isPr?'<span class="prtag">RECORD&nbsp;</span>':''}${pTxt}</div>
      <div class="cell ${s.done?'srow-done':''}">${noW?'':`<input class="sinp" id="w-${ei}-${si}" inputmode="decimal" data-in="setW" data-e="${ei}" data-s="${si}" value="${s.w!=null?dispW(s.w):''}" placeholder="${phW}" aria-label="Charge">`}</div>
      <div class="cell ${s.done?'srow-done':''}"><input class="sinp" id="r-${ei}-${si}" inputmode="numeric" data-in="setR" data-e="${ei}" data-s="${si}" value="${s.r!=null?s.r:''}" placeholder="${phR}" aria-label="${rHead}"></div>
      <div class="cell ${s.done?'srow-done':''}"><button class="chk" data-a="toggleSet" data-e="${ei}" data-s="${si}" aria-label="Valider la série">${I.check}</button></div>
      <div class="cell"><button class="del" data-a="delSet" data-e="${ei}" data-s="${si}" aria-label="Supprimer la série">${I.x}</button></div>`;
  }).join('');
  return `<div class="exc">
    <div class="exc-h">${thumb(e.exId)}<button class="nm" data-a="exInfo" data-id="${e.exId}">${esc(ex.name)}</button>${e.target?`<span class="target">obj. ${esc(e.target)}</span>`:''}<button class="iconbtn" style="width:34px;height:34px" data-a="exMenu" data-e="${ei}" aria-label="Options de l’exercice">${I.dots}</button></div>
    ${e.note?`<div class="exc-note">${esc(e.note)}</div>`:''}
    <div class="sets"><span class="hd">Série</span><span class="hd l">Précédent</span><span class="hd">${wHead}${wHead?`<br><span style="font-weight:600;letter-spacing:0;text-transform:none">${kind==='wr'?unit():'+'+unit()}</span>`:''}</span><span class="hd">${rHead}</span><span class="hd">✓</span><span></span>${rows}</div>
    <div class="row between" style="padding:0 4px"><button class="btn sm" data-a="addSet" data-e="${ei}">${I.plus}Série</button><span class="small muted">Repos ${fmtSec(e.rest||S.settings.rest)}</span></div></div>`;
}

function filterEx(q, m){
  const norm = t => (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'()-]/g,' ').replace(/\s+/g,' ').trim();
  const words = norm(q).split(' ').filter(Boolean);
  return allEx().filter(e => { if (m !== 'Tous' && e.muscle !== m) return false; if (!words.length) return true;
      const hay = norm(e.name + ' ' + enName(e) + ' ' + e.equip + ' ' + e.muscle); return words.every(w => hay.includes(w)); })
    .sort((a,b) => a.name.localeCompare(b.name,'fr'));
}

  const list = filterEx(UI.exQ, UI.exM), c = exCount();

}

const PLATES = [{kg:25,c:'#D7262E',f:'#fff',h:110},{kg:20,c:'#1D4ED8',f:'#fff',h:110},{kg:15,c:'#F2C200',f:'#111',h:100},{kg:10,c:'#16884C',f:'#fff',h:90},{kg:5,c:'#F4F4F4',f:'#111',h:70},{kg:2.5,c:'#D7262E',f:'#fff',h:56},{kg:2,c:'#1D4ED8',f:'#fff',h:52},{kg:1.25,c:'#C9CCD2',f:'#111',h:46},{kg:1,c:'#16884C',f:'#fff',h:42},{kg:0.5,c:'#F4F4F4',f:'#111',h:38}];

function rmOut(rm){

function plateOut(){
  const t = toKg(UI.plate.t), bar = +(UI.plate.bar ?? S.settings.bar);

  if (t < bar) return '<span class="small muted">La charge est inférieure au poids de la barre.</span>';
  let side = (t - bar)/2; const used = [];
  for (const p of PLATES) while (side >= p.kg - 1e-6) { used.push(p); side -= p.kg; }
  const real = bar + used.reduce((a,p)=>a+p.kg,0)*2;
  const viz = used.map(p => `<span class="pl" style="background:${p.c};color:${p.f};height:${p.h}px;width:${p.kg>=10?18:13}px">${p.kg>=5?p.kg:''}</span>`);
  const counts = {}; used.forEach(p => counts[p.kg] = (counts[p.kg]||0)+1);
  return `<div class="barviz" aria-hidden="true"><span class="sleeve"></span>${[...viz].reverse().join('')}<span class="collar"></span><span class="shaft"></span><span class="collar"></span>${viz.join('')}<span class="sleeve"></span></div>

   ${Math.abs(real - t) > 0.01 ? `<span class="small muted">Charge réalisable la plus proche : ${nf.format(dispW(real))} ${unit()}</span>` : ''}`;
}

/* ---------- Charts (SVG) ---------- */
function lineChart(pts, fmt){
  if (pts.length < 2) return '<p class="small muted" style="margin:0">Il faut au moins deux points pour tracer une courbe.</p>';
  const W = 320, H = 150, L = 34, R = 10, T = 12, B = 22;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; } const pad = (y1-y0)*0.15; y0 -= pad; y1 += pad;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = x => L + (x-x0)/(x1-x0||1)*(W-L-R), Y = y => T + (1-(y-y0)/(y1-y0))*(H-T-B);
  const line = pts.map((p,i) => (i?'L':'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = line + ` L ${X(x1).toFixed(1)} ${H-B} L ${X(x0).toFixed(1)} ${H-B} Z`;
  const ticks = [y0+pad, (y0+y1)/2, y1-pad];
  const lp = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe d’évolution">
    ${ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${fmt(Math.round(t*10)/10)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.2" fill="var(--accent)"/>`).join('')}
    <circle cx="${X(lp.x)}" cy="${Y(lp.y)}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${L}" y="${H-6}">${dShort(x0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dShort(x1)}</text></svg>`;
}
function barChart(data, fmt){
  const W = 320, H = 170, L = 34, R = 6, T = 10, B = 34;
  const max = Math.max(1, ...data.map(d=>d.v));
  const bw = (W-L-R)/data.length;
  const Y = v => T + (1 - v/max)*(H-T-B);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogramme du volume hebdomadaire">
    ${[0, max/2, max].map(t => `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" ${t?'stroke-dasharray="3 4"':''}/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${fmt(t)}</text>`).join('')}
    ${data.map((d,i) => { const x = L + i*bw + bw*0.18, w = bw*0.64, y = Y(d.v); const last = i === data.length-1;
      return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,H-B-y)}" rx="3" fill="var(--accent)" fill-opacity="${last?1:.55}"/>
      <text x="${x+w/2}" y="${H-B+13}" text-anchor="middle">${d.label.replace('.','')}</text><text x="${x+w/2}" y="${H-B+26}" text-anchor="middle" style="font-weight:700">${d.sub}</text>`; }).join('')}</svg>`;
}

const sheets = [];

function renderSheets(){
  const root = $('#sheets');
  [...root.children].forEach(el => { if (!sheets.some(s => s.id === el.dataset.id)) el.remove(); });
  sheets.forEach(s => {
    let el = root.querySelector(`[data-id="${s.id}"]`);
    if (!el) { el = document.createElement('div'); el.className = 'layer'; el.dataset.id = s.id;
      el.innerHTML = `<div class="scrim" data-a="closeSheet"></div><section class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sbody"></div></section>`; root.appendChild(el); }
    const body = el.querySelector('.sbody'), st = body.scrollTop;
    const act = document.activeElement, actId = act && body.contains(act) ? act.id : null, sel = actId && act.selectionStart;
    body.innerHTML = s.fn(s);
    body.scrollTop = st;
    if (actId) { const n = document.getElementById(actId); if (n) { n.focus(); try { n.setSelectionRange(sel, sel); } catch(e){} } }
  });
}

/* ---------- Transformations (one step per training day, two steps lost per idle week) ---------- */
const FORMS = [
 {n:'Forme de base', c1:'#AEB6C6', c2:'#5D6577', hair:'#14161D', d:'Le point de départ. Chaque séance compte.'},
 {n:'Kaioken', c1:'#FF6A4D', c2:'#C0121F', hair:'#14161D', d:'Une aura rouge s’allume : la régularité commence à payer.'},
 {n:'Super Saiyan', c1:'#FFE866', c2:'#F5A300', hair:'#FFD42A', spikes:2, d:'Le premier grand cap. Cheveux dorés, puissance multipliée.'},
 {n:'Super Saiyan 2', c1:'#FFF08A', c2:'#F5B800', hair:'#FFD42A', spikes:2, bolts:'#BFE9FF', d:'Des éclairs crépitent autour de vous. Rien ne vous arrête.'},
 {n:'Super Saiyan 3', c1:'#FFD84A', c2:'#E08A00', hair:'#FFC400', spikes:2, long:true, bolts:'#BFE9FF', d:'Une crinière jusqu’au bas du dos. Une discipline rare.'},
 {n:'Super Saiyan God', c1:'#FF7A92', c2:'#D1123F', hair:'#E0244A', spikes:1, d:'Une énergie divine, calme et brûlante.'},
 {n:'Super Saiyan Blue', c1:'#7BEFFF', c2:'#1C7BFF', hair:'#3FC8FF', spikes:2, d:'La maîtrise totale de l’énergie divine.'},
 {n:'Ultra Instinct (Signe)', c1:'#D9E2FF', c2:'#6B7BD6', hair:'#23283B', spikes:1, sparks:true, d:'Le corps bouge tout seul. L’entraînement est devenu un réflexe.'},
 {n:'Ultra Instinct Maîtrisé', c1:'#FFFFFF', c2:'#9FB0E8', hair:'#E8EDF7', spikes:1, sparks:true, d:'Le sommet. Gardez le rythme pour rester ici.'},
];
const MAXF = FORMS.length - 1;
const dayKey = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const dayDiff = (a, b) => Math.round((b - a) / DAY);
const addDays = (t, n) => dayKey(t + n*DAY + 12*3600e3);
// Rules: +1 form per day with a session; every 7 full days without a session costs 2 forms.
function powerState(){
  const days = [...new Set(S.workouts.map(w => dayKey(w.start)))].sort((a,b) => a - b);
  const today = dayKey(Date.now()), events = [];
  let lvl = 0, prev = null;
  const drop = (from, to) => { const pen = Math.floor((dayDiff(from, to) - 1) / 7);
    for (let k = 1; k <= pen; k++) { const b = lvl; lvl = Math.max(0, lvl - 2); events.push({t:addDays(from, 7*k + 1), d:lvl - b, lvl}); } };
  for (const d of days) {
    if (prev != null) drop(prev, d);
    const b = lvl; lvl = Math.min(MAXF, lvl + 1); events.push({t:d, d:lvl - b, lvl, up:true}); prev = d;
  }
  if (prev != null) drop(prev, today);
  let nextDrop = null;
  if (prev != null) { const done = Math.max(0, Math.floor((dayDiff(prev, today) - 1) / 7)); nextDrop = addDays(prev, 7*(done + 1) + 1); }
  return {level:lvl, events, last:prev, today, nextDrop, trainedToday: prev === today};
}
function powerStatus(P){
  const nxt = FORMS[Math.min(MAXF, P.level + 1)];
  const left = P.nextDrop ? dayDiff(P.today, P.nextDrop) : null;
  const deadline = P.nextDrop ? new Date(addDays(P.nextDrop, -1)).toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'}) : '';
  if (P.last == null) return {tone:'keep', txt:`Votre première séance débloque ${nxt.n}.`, left};
  if (P.trainedToday) return {tone:'up', txt: P.level === MAXF ? 'Séance du jour validée. Vous êtes au sommet.' : `Séance du jour validée. Prochaine séance : ${nxt.n}.`, left};
  if (left <= 2 && P.level > 0) return {tone:'down', txt:`Attention : sans séance d’ici ${deadline}, vous perdez 2 transformations.`, left};
  return {tone:'keep', txt: P.level === MAXF ? `Au sommet. Revenez avant ${deadline} pour y rester.` : `Prochaine séance : ${nxt.n}. À faire avant ${deadline}.`, left};
}

/* Your own picture, GIF or video per form, kept on this device only (IndexedDB). */
const Media = {
  db:null, urls:{}, types:{},
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { try { const r = indexedDB.open('fonte-media', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('m'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }); },
  async load(){ try { await this.open(); await new Promise(res => { const req = this.db.transaction('m').objectStore('m').openCursor();
    req.onsuccess = () => { const c = req.result; if (c) { const v = c.value; this.set(c.key, v instanceof Blob ? v : (v && v.buf ? new Blob([v.buf], {type:v.type}) : null)); c.continue(); } else res(); }; req.onerror = () => res(); }); } catch(e){} },
  set(k, blob){ if (this.urls[k]) URL.revokeObjectURL(this.urls[k]); delete this.urls[k]; delete this.types[k]; if (blob) { this.urls[k] = URL.createObjectURL(blob); this.types[k] = blob.type || ''; } },
  async write(k, blob){
    const val = blob ? {type:blob.type || '', buf: await blob.arrayBuffer()} : null;
    await this.open();
    await new Promise((res, rej) => { const tx = this.db.transaction('m', 'readwrite'); const st = tx.objectStore('m'); val ? st.put(val, k) : st.delete(k);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
    this.set(k, blob); },
  html(k, extra=''){ const u = this.urls[k]; if (!u) return ''; const st = frameStyle(k);
    return `<span class="pmwrap">${this.types[k].startsWith('video/') ? `<video class="pmedia" data-k="${k}" src="${u}" autoplay muted loop playsinline ${st} ${extra}></video>` : `<img class="pmedia" data-k="${k}" src="${u}" alt="" ${st}>`}</span>`; }
};

  return 'Publiée le ' + d.toLocaleDateString('fr-FR', {day:'numeric', month:'long'}) + ' à ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}
// Framing per visual: x/y = visible point in % (object-position), z = zoom factor.
const frameOf = k => ({x:50, y:50, z:1, ...((S.settings.frames || {})[k] || {})});
const frameCss = f => `object-position:${f.x}% ${f.y}%;transform:scale(${f.z});transform-origin:${f.x}% ${f.y}%`;
const frameStyle = k => (S.settings.frames || {})[k] ? `style="${frameCss(frameOf(k))}"` : '';
function setFrame(k, patch){
  const f = {...frameOf(k), ...patch};
  f.x = Math.max(0, Math.min(100, Math.round(f.x))); f.y = Math.max(0, Math.min(100, Math.round(f.y))); f.z = Math.max(1, Math.min(4, Math.round(f.z * 100) / 100));
  S.settings.frames = {...(S.settings.frames || {}), [k]: f};
  document.querySelectorAll(`.pmedia[data-k="${k}"]`).forEach(m => m.style.cssText = frameCss(f));
  const out = document.getElementById('frVals'); if (out) out.textContent = `Horizontal ${f.x} % · Vertical ${f.y} % · Zoom ×${f.z.toFixed(2)}`;
  ['frX','frY','frZ'].forEach((id, j) => { const el = document.getElementById(id); if (el && document.activeElement !== el) el.value = [f.x, f.y, Math.round(f.z * 100)][j]; });
  save();
}

    <div class="stack" style="gap:14px">

// Compares the computed level to the last one shown and plays the matching moment.
function checkPower(silent){
  const P = powerState();
  if (S.settings.powerRules !== 2) { S.settings.powerRules = 2; S.settings.seenLvl = P.level; save(); return; }
  const seen = S.settings.seenLvl;
  if (seen == null || silent) { if (seen !== P.level) { S.settings.seenLvl = P.level; save(); } return; }
  if (P.level === seen) return;
  S.settings.seenLvl = P.level; save();
  if (P.level > seen) playPowerUp(seen, P.level);
  else openSheet(() => `${sheetHead('Transformation perdue')}<div class="pcard big" style="--c1:${FORMS[P.level].c1};--c2:${FORMS[P.level].c2}"><span class="pemb">${formVisual(P.level,'live')}</span><span class="pbody"><span class="lbl">Retour au niveau ${P.level}</span><span class="pname">${FORMS[P.level].n}</span></span></div>
    <p class="muted" style="margin:0">Une semaine sans séance coûte 2 transformations. Votre prochaine séance vous fait remonter en ${FORMS[Math.min(MAXF,P.level+1)].n}.</p><button class="btn primary block" data-a="closeSheet">Compris, on repart</button>`);
}
function powerSound(){
  if (!S.settings.sound || !audioCtx) return;
  try {
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(520, t + 1.5);
    f.type = 'lowpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3000, t + 1.5);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 1.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.75);
    o.connect(f); f.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 1.8);
    const b = audioCtx.createOscillator(), bg = audioCtx.createGain(); b.type = 'sine'; b.frequency.setValueAtTime(140, t + 1.6); b.frequency.exponentialRampToValueAtTime(40, t + 2.4);
    bg.gain.setValueAtTime(0.0001, t + 1.6); bg.gain.exponentialRampToValueAtTime(0.45, t + 1.65); bg.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
    b.connect(bg); bg.connect(audioCtx.destination); b.start(t + 1.6); b.stop(t + 2.6);
  } catch(e){}
}
function playPowerUp(from, to, preview){
  const el = $('#powerup'), f = FORMS[to];
  const parts = Array.from({length:34}, (_,k) => `<i style="left:${(k*37)%100}%;animation-delay:${((k*13)%20)/10}s;animation-duration:${1.4 + (k%5)*.25}s;width:${3+k%4}px;height:${10+(k%5)*6}px"></i>`).join('');
  el.style.setProperty('--c1', f.c1); el.style.setProperty('--c2', f.c2);
  el.innerHTML = `<div class="pu-bg"></div><div class="pu-parts">${parts}</div><div class="pu-flash"></div>
    <div class="pu-stage"><div class="pu-ring"></div><div class="pu-old">${formVisual(from)}</div><div class="pu-new">${animVisual(to,'live')}</div></div>
    <div class="pu-txt"><span class="pu-kicker">${preview ? 'Aperçu de l’animation' : 'Nouvelle transformation débloquée'}</span><h2 class="pu-name">${f.n}</h2><p>${f.d}</p><span class="pu-lvl">Niveau ${to}/${MAXF}${to - from > 1 ? ' · +' + (to - from) + ' niveaux' : ''}</span>
    <button class="btn primary xl" data-a="closePower">Continuer</button></div>`;
  el.hidden = false; el.classList.remove('run'); void el.offsetWidth; el.classList.add('run');
  const vid = el.querySelector('.pu-new video');
  ensureAudio();
  if (vid) { vid.pause(); setTimeout(() => { if (!el.contains(vid)) return; vid.currentTime = 0; vid.muted = !S.settings.sound; vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); }); }, 1600); }
  powerSound();
  if (S.settings.vibrate) { try { navigator.vibrate && navigator.vibrate([60,60,60,60,120,80,400]); } catch(e){} }
}

/* ---------- Workout logic ---------- */
function newSet(){ return {w:null, r:null, done:false, t:'n'}; }
function startWorkout(name, exercises, routineId=null){
  if (S.active) { toast('Une séance est déjà en cours.'); UI.tab = 'workout'; closeAll(); render(); return; }
  S.active = {id:uid(), name, start:Date.now(), routineId, notes:'', exercises};
  save(); closeAll(); UI.tab = 'workout'; UI.scroll.workout = 0; render(); ensureAudio(); requestWake();
}
function fromRoutine(r){ return r.exercises.map(e => ({exId:e.exId, rest:e.rest, target:e.reps, note:'', sets:Array.from({length:e.sets}, () => ({...newSet(), w:e.w ?? null, auto:e.w != null}))})); }
function fromWorkout(w){ return w.exercises.map(e => ({exId:e.exId, rest:e.rest, target:e.target||'', note:'', sets:e.sets.map(s => ({...newSet(), t:s.t}))})); }
function exEntry(id){ return {exId:id, rest:S.settings.rest, target:'', note:'', sets:[newSet(), newSet(), newSet()]}; }

function finishWorkout(){
  const a = S.active;
  const exercises = a.exercises.map(e => ({...e, sets:e.sets.filter(s => s.done).map(s => ({w:s.w, r:s.r, t:s.t}))})).filter(e => e.sets.length);
  if (!exercises.length) { confirmBox('Aucune série validée', 'Validez au moins une série avec ✓ pour enregistrer la séance, ou abandonnez-la.', 'Abandonner', () => discardWorkout()); return; }
  const prs = [];
  for (const e of exercises) {
    const ex = exById(e.exId); if (ex.kind === 'time') continue;
    const b = bestOf(e.exId); if (!b.e1 && !b.w) continue;
    const top = Math.max(...e.sets.filter(isWork).map(s => e1rm(s.w, s.r)), 0), topW = Math.max(...e.sets.filter(isWork).map(s => s.w||0), 0);
    if (top > b.e1 + 0.01) prs.push({exId:e.exId, label:'1RM estimé ' + nf.format(Math.round(dispW(top))) + ' ' + unit()});
    else if (topW > b.w + 0.01) prs.push({exId:e.exId, label:'Charge max ' + nf.format(dispW(topW)) + ' ' + unit()});
  }
  const w = {id:a.id, name:a.name.trim() || 'Séance', start:a.start, end:Date.now(), routineId:a.routineId, notes:a.notes, exercises, prs};
  S.workouts.unshift(w); S.active = null; Rest.stop(); releaseWake();
  Store.saveWorkout(w); save(); closeAll(); UI.tab = 'home'; render();
  const confetti = Array.from({length:18}, (_,i) => { const ang = i/18*Math.PI*2, d = 70 + (i%3)*22; return `<i style="--x:${Math.round(Math.cos(ang)*d*1.6)}px;--y:${Math.round(Math.sin(ang)*d)}px;background:${Object.values(MCOL)[i%12]}"></i>`; }).join('');
  openSheet(() => `<div class="celebrate"><span class="tro">${I.trophy}</span>${confetti}</div>${sheetHead('Bien joué !')}
    <div class="small muted" style="text-transform:capitalize">${esc(w.name)} · ${dLong(w.start)}</div>
    <div class="grid3 sumtiles"><div class="stat"><span class="lbl">Durée</span><span class="v" style="font-size:22px">${fmtDur(w.end-w.start)}</span></div><div class="stat"><span class="lbl">Volume</span><span class="v" style="font-size:22px">${fmtVol(wVolume(w))}</span></div><div class="stat"><span class="lbl">Séries</span><span class="v" style="font-size:22px">${wSets(w)}</span></div></div>
    ${prs.length?`<div class="card stack" style="border-color:var(--pr)"><div class="row" style="color:var(--pr)">${I.trophy.replace('<svg','<svg width="22" height="22"')}<b>${prs.length} record${prs.length>1?'s':''} battu${prs.length>1?'s':''}</b></div>${prs.map(p=>`<span>${esc(exById(p.exId).name)} · <b>${p.label}</b></span>`).join('')}</div>`:'<p class="muted" style="margin:0">Séance enregistrée. La régularité fait la progression.</p>'}
    ${w.routineId && S.routines.some(r=>r.id===w.routineId) ? `<button class="btn ghost block" data-a="updateRoutineFrom" data-id="${w.id}">Mettre à jour le programme avec cette séance</button>` : `<button class="btn ghost block" data-a="saveAsRoutine" data-id="${w.id}">Enregistrer comme programme</button>`}
    <button class="btn primary block" data-a="closeSheet">Fermer</button>`);

function discardWorkout(){ S.active = null; Rest.stop(); releaseWake(); save(); closeAll(); UI.tab = 'home'; render(); toast('Séance abandonnée.'); }
function routineFromWorkout(w){ return w.exercises.map(e => ({exId:e.exId, sets:e.sets.filter(isWork).length || e.sets.length, reps:e.target || String(Math.round(e.sets.reduce((a,s)=>a+(s.r||0),0)/e.sets.length) || 10), rest:e.rest || S.settings.rest, w:Math.max(0, ...e.sets.filter(isWork).map(s => s.w||0)) || null})); }

/* ---------- Rest timer ---------- */
const Rest = {
  end:0, total:0, label:'', iv:null,
  start(sec, label=''){ this.total = sec; this.end = Date.now() + sec*1000; this.label = label; clearInterval(this.iv); this.iv = setInterval(() => this.tick(), 250); renderRest(); },
  add(d){ if (!this.end) return; this.end += d*1000; this.total = Math.max(1, this.total + d); if (this.end <= Date.now()) return this.stop(); renderRest(); },
  stop(){ clearInterval(this.iv); this.end = 0; renderRest(); },
  tick(){ const left = (this.end - Date.now())/1000; if (left <= 0) { this.stop(); alertDone(); toast('Repos terminé : série suivante !'); } else updateRest(left); }
};
function renderRest(){
  const el = $('#rest');
  if (!Rest.end) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `<span class="fill" id="restFill"></span><span class="time" id="restTime"></span><span class="what">Repos<br>${esc(Rest.label)}</span><button data-a="restAdd" data-d="-15">−15</button><button data-a="restAdd" data-d="15">+15</button><button data-a="restSkip">Passer</button>`;
  updateRest((Rest.end - Date.now())/1000);
}
function updateRest(left){ const t = $('#restTime'), f = $('#restFill'); if (t) t.textContent = fmtClock(left); if (f) f.style.width = (100 - left/Rest.total*100) + '%'; }
let audioCtx = null;
function ensureAudio(){ try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} }
function alertDone(){
  if (S.settings.vibrate) { try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){} }
  if (!S.settings.sound || !audioCtx) return;
  try { [0, .22, .44].forEach((d,i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = i === 2 ? 1320 : 880; o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime + d; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.18); o.start(t); o.stop(t+0.2); }); } catch(e){}
}
async function requestWake(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){ wakeLock = null; } }
function releaseWake(){ try { wakeLock && wakeLock.release(); } catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.active) requestWake(); });

/* ---------- Sample data ---------- */
function loadSample(){
  const plan = [
    {name:'Push · Poussée', ex:[['bench',60,8,4],['incline_db',22,10,3],['ohp',37.5,8,3],['lateral',8,14,3],['pushdown',22.5,12,3]]},
    {name:'Pull · Tirage', ex:[['pullup',0,7,4],['row_bb',55,8,4],['seated_row',50,11,3],['facepull',17.5,15,3],['curl_bb',27.5,10,3]]},
    {name:'Legs · Jambes', ex:[['squat',80,6,4],['rdl',70,8,3],['legpress',140,11,3],['legcurl',35,12,3],['calf_st',60,14,4]]},
  ];
  const now = Date.now(), base = weekStart(now).getTime() - 8*7*DAY;
  const offs = [0, 2, 4]; let k = 0;
  for (let wk = 0; wk < 8; wk++) for (let i = 0; i < 3; i++) {
    const start = base + wk*7*DAY + offs[i]*DAY + (18*60 + (k%3)*15)*60000; k++;
    if (start > now - 3600e3) continue;
    const p = plan[i], g = wk*0.025;
    const exercises = p.ex.map(([id,w,r,n]) => { const ww = w ? Math.round(w*(1+g)/2.5)*2.5 : null;
      return {exId:id, rest:id==='squat'||id==='bench'?150:90, target:'', note:'', sets:[...(ww && ww>=40?[{w:Math.round(ww*0.5/2.5)*2.5, r:10, t:'w'}]:[]), ...Array.from({length:n}, (_,j) => ({w:ww, r:Math.max(4, r + (wk%3===2?1:0) - (j===n-1?1:0)), t:'n'}))]}; });
    S.workouts.push({id:'ex' + uid(), name:p.name, start, end:start + (52 + (k*7)%20)*60000, routineId:null, notes:'', exercises, prs:[], sample:true});
  }
  S.workouts.sort((a,b) => b.start - a.start);
  for (let d = 56; d >= 0; d -= 4) S.body.push({id:'ex'+uid(), t:now - d*DAY, w:Math.round((78.4 - (56-d)*0.025 + Math.sin(d)*0.3)*10)/10, f: d%12===0 ? Math.round((17.5 - (56-d)*0.03)*10)/10 : null, sample:true});
  if (!S.routines.length) TEMPLATES.slice(0,3).forEach(t => S.routines.push(tplRoutine(t)));
  S.workouts.filter(w => w.sample).forEach(w => Store.saveWorkout(w)); save();
  closeAll(); render(); toast('Exemples chargés : 8 semaines de séances.'); checkPower();
}
function removeSample(){
  S.workouts.filter(w => w.sample).forEach(w => Store.deleteWorkout(w.id));
  S.workouts = S.workouts.filter(w => !w.sample); S.body = S.body.filter(b => !b.sample); checkPower(true); save(); refreshSheet(); render(); toast('Exemples retirés.');
}
function tplRoutine(t){ return {id:uid(), name:t.name, notes:'', exercises:t.ex.map(([exId,sets,reps,rest]) => ({exId, sets, reps:String(reps), rest}))}; }

/* ---------- Actions ---------- */
const A = {
  tab:d => { UI.tab = d.t; closeAll(); render(); },
  goHistory:() => { UI.tab = 'progress'; UI.prog = 'history'; render(); },
  prog:d => { UI.prog = d.p; render(); },
  settings:() => openSettings(),
  openPower:() => openPower(),
  putMedia:d => { const file = UI.pendingMedia, k = mediaKey(d.k); if (!file) return; closeSheet();
    Media.write(k, file).then(() => { refreshSheet(); render(); toast((typeof k === 'string' ? 'Animation' : 'Image') + ' ajoutée à ' + FORMS[mediaForm(k)].n + '.'); }).catch(e => toast(mediaError(e))); },
  previewPower:d => { const i = +d.i; ensureAudio(); playPowerUp(Math.max(0, i - 1), i, true); },
  openFrame:d => openFrame(mediaKey(d.k)),
  frReset:d => { const k = mediaKey(d.k); setFrame(k, {x:50, y:50, z:1}); const fr = {...S.settings.frames}; delete fr[k]; S.settings.frames = fr; save(); },
  delMedia:d => Media.write(mediaKey(d.k), null).then(() => { refreshSheet(); render(); toast('Image retirée.'); }).catch(() => toast('Impossible de retirer l’image.')),
  closePower:() => { const el = $('#powerup'); el.hidden = true; el.innerHTML = ''; el.classList.remove('run'); render(); },
  closeSheet:() => closeSheet(),
  confirmOk:() => { const s = sheets[sheets.length-1]; closeSheet(); s && s.onOk && s.onOk(); },
  startEmpty:() => startWorkout(defaultName(), []),
  startRoutine:d => { const r = S.routines.find(x => x.id === d.id); if (r) startWorkout(r.name, fromRoutine(r), r.id); },
  repeatWorkout:d => { const w = S.workouts.find(x => x.id === d.id); if (w) startWorkout(w.name, fromWorkout(w), w.routineId); },
  loadSample:() => loadSample(),
  removeSample:() => removeSample(),
  // routines
  newRoutine:() => openRoutineEditor(null),
  editRoutine:d => openRoutineEditor(S.routines.find(r => r.id === d.id)),
  routineMenu:d => { const r = S.routines.find(x => x.id === d.id); openSheet(() => `${sheetHead(esc(r.name))}<div class="list">
      <button class="li" data-a="editRoutine" data-id="${r.id}"><span class="grow t">Modifier</span>${I.chev}</button>
      <button class="li" data-a="dupRoutine" data-id="${r.id}"><span class="grow t">Dupliquer</span>${I.chev}</button>
      <button class="li" data-a="delRoutine" data-id="${r.id}" style="color:var(--danger)"><span class="grow t">Supprimer</span></button></div>`); },
  dupRoutine:d => { const r = S.routines.find(x => x.id === d.id); S.routines.push({...clone(r), id:uid(), name:r.name + ' (copie)'}); save(); closeAll(); render(); toast('Programme dupliqué.'); },
  delRoutine:d => confirmBox('Supprimer le programme ?', 'Les séances déjà réalisées restent dans votre historique.', 'Supprimer', () => { S.routines = S.routines.filter(r => r.id !== d.id); save(); closeAll(); render(); toast('Programme supprimé.'); }),
  addTemplate:d => { S.routines.push(tplRoutine(TEMPLATES[d.i])); save(); render(); toast('« ' + TEMPLATES[d.i].name + ' » ajouté à vos programmes.'); },
  rMove:d => { const a = UI.editR.exercises, i = +d.i, j = i + +d.d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; refreshSheet(); },
  rDel:d => { UI.editR.exercises.splice(+d.i, 1); refreshSheet(); },
  rSets:d => { const e = UI.editR.exercises[+d.i]; e.sets = Math.max(1, Math.min(12, e.sets + +d.d)); refreshSheet(); },
  rAddEx:() => openPicker(ids => { ids.forEach(id => UI.editR.exercises.push({exId:id, sets:3, reps:exById(id).kind==='time'?'45':'8-12', rest:S.settings.rest})); }),
  rSave:() => { const d = UI.editR; d.name = d.name.trim() || 'Programme'; const i = S.routines.findIndex(r => r.id === d.id); if (i >= 0) S.routines[i] = d; else S.routines.push(d); save(); closeAll(); render(); toast('Programme enregistré.'); },
  saveAsRoutine:d => { const w = S.workouts.find(x => x.id === d.id); S.routines.push({id:uid(), name:w.name, notes:'', exercises:routineFromWorkout(w)}); save(); closeAll(); render(); toast('Programme créé à partir de la séance.'); },
  updateRoutineFrom:d => { const w = S.workouts.find(x => x.id === d.id), r = S.routines.find(x => x.id === w.routineId); if (r) { const old = Object.fromEntries(r.exercises.map(e => [e.exId, e])); r.exercises = routineFromWorkout(w).map(e => old[e.exId] ? {...e, reps:old[e.exId].reps, rest:old[e.exId].rest, w:e.w ?? old[e.exId].w} : e); save(); } closeAll(); render(); toast('Programme mis à jour.'); },
  // picker
  pickM:d => { UI.pick.m = d.m; refreshSheet(); },
  pickToggle:d => { const s = UI.pick.sel, i = s.indexOf(d.id); i >= 0 ? s.splice(i,1) : s.push(d.id); refreshSheet(); },
  pickDone:() => { const p = UI.pick; closeSheet(); UI.pick = null; p.onDone(p.sel); refreshSheet(); render(); },
  // workout
  addExToWorkout:() => openPicker(ids => { ids.forEach(id => S.active.exercises.push(exEntry(id))); save(); }),
  addSet:d => { const e = S.active.exercises[+d.e], last = e.sets[e.sets.length-1]; e.sets.push({...newSet(), w:last?last.w:null, r:last?last.r:null, auto:!!(last && last.w != null)}); save(); render(); },
  delSet:d => { const e = S.active.exercises[+d.e]; e.sets.splice(+d.s, 1); save(); render(); },
  setType:d => { const s = S.active.exercises[+d.e].sets[+d.s]; s.t = {n:'w', w:'d', d:'f', f:'n'}[s.t] || 'n'; save(); render(); },
  usePrev:d => { const e = S.active.exercises[+d.e], p = (prevSets(e.exId)||[])[+d.s]; if (!p) return; const s = e.sets[+d.s]; s.w = p.w; s.r = p.r; save(); render(); },
  toggleSet:d => {
    ensureAudio();
    const e = S.active.exercises[+d.e], s = e.sets[+d.s], ex = exById(e.exId);
    if (!s.done) {
      const p = (prevSets(e.exId)||[])[+d.s];
      if (s.w == null && ex.kind === 'wr') s.w = p ? p.w : null;
      if (s.w == null && ex.kind !== 'wr' && p) s.w = p.w;
      if (s.r == null) s.r = p ? p.r : (parseInt(e.target) || null);
      if (!s.r) { toast(ex.kind === 'time' ? 'Indiquez la durée en secondes.' : 'Indiquez le nombre de répétitions.'); document.getElementById('r-'+d.e+'-'+d.s)?.focus(); return; }
      if (ex.kind === 'wr' && !s.w) { toast('Indiquez la charge.'); document.getElementById('w-'+d.e+'-'+d.s)?.focus(); return; }
      s.done = true;
      Rest.start(e.rest || S.settings.rest, ex.name);
    } else s.done = false;
    save(); render();
  },
  exMenu:d => { const i = +d.e; openSheet(() => { const e = S.active.exercises[i]; if (!e) return ''; return `${sheetHead(esc(exById(e.exId).name))}
      <div class="card row between"><span>Temps de repos</span><div class="stepper"><button data-a="exRest" data-e="${i}" data-d="-15">−</button><span class="v num" style="font-size:18px">${fmtSec(e.rest||S.settings.rest)}</span><button data-a="exRest" data-e="${i}" data-d="15">+</button></div></div>
      <label class="field"><span class="lbl">Note pour cet exercice</span><textarea id="exNote" class="inp" data-in="exNote" data-e="${i}" placeholder="Réglage machine, prise, tempo…">${esc(e.note||'')}</textarea></label>
      <div class="list"><button class="li" data-a="exMove" data-e="${i}" data-d="-1"><span class="grow t">Monter</span>${I.up.replace('<svg','<svg width="18" height="18"')}</button><button class="li" data-a="exMove" data-e="${i}" data-d="1"><span class="grow t">Descendre</span>${I.down.replace('<svg','<svg width="18" height="18"')}</button>
      <button class="li" data-a="exReplace" data-e="${i}"><span class="grow t">Remplacer l’exercice</span>${I.chev}</button>
      <button class="li" data-a="exRemove" data-e="${i}" style="color:var(--danger)"><span class="grow t">Retirer de la séance</span></button></div>`; }, {onClose:render}); },
  exRest:d => { const e = S.active.exercises[+d.e]; e.rest = Math.max(15, Math.min(600, (e.rest||S.settings.rest) + +d.d)); save(); refreshSheet(); render(); },
  exMove:d => { const a = S.active.exercises, i = +d.e, j = i + +d.d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(); closeSheet(); render(); },
  exRemove:d => { S.active.exercises.splice(+d.e, 1); save(); closeSheet(); render(); },
  exReplace:d => { const i = +d.e; closeSheet(); openPicker(ids => { if (ids[0]) { S.active.exercises[i].exId = ids[0]; save(); } }, 'Remplacer par…'); },
  finish:() => { const a = S.active, open = a.exercises.reduce((n,e) => n + e.sets.filter(s => !s.done).length, 0);
    confirmBox('Terminer la séance ?', open ? `${open} série${open>1?'s':''} non validée${open>1?'s':''} ne ser${open>1?'ont':'a'} pas enregistrée${open>1?'s':''}.` : 'Toutes les séries sont validées.', 'Terminer', finishWorkout, false); },
  cancelWorkout:() => confirmBox('Abandonner la séance ?', 'Les séries saisies seront perdues.', 'Abandonner', discardWorkout),
  // rest
  restAdd:d => Rest.add(+d.d),
  restSkip:() => Rest.stop(),
  restStart:d => { ensureAudio(); Rest.start(+d.s, 'Minuteur'); },
  // exercises
  exM:d => { UI.exM = d.m; render(); },
  exInfo:d => openExInfo(d.id),
  newEx:() => openNewEx(),
  saveNewEx:() => { const name = $('#nxName').value.trim(); if (!name) { toast('Donnez un nom à l’exercice.'); $('#nxName').focus(); return; }
    const ex = {id:'c_' + uid(), name, muscle:$('#nxMuscle').value, equip:$('#nxEquip').value, kind:$('#nxKind').value, en:$('#nxEn').value.trim(), custom:true};
    S.customEx.push(ex); save(); closeSheet(); if (UI.pick) { UI.pick.sel.push(ex.id); UI.pick.q = ''; } refreshSheet(); render(); toast('Exercice créé.'); },
  delCustomEx:d => confirmBox('Supprimer cet exercice ?', 'Il disparaît de la bibliothèque et des programmes. Les séances passées gardent leurs données.', 'Supprimer', () => {
    S.customEx = S.customEx.filter(e => e.id !== d.id); S.routines.forEach(r => r.exercises = r.exercises.filter(e => e.exId !== d.id)); save(); closeAll(); render(); }),
  // history
  calMove:d => { let {y,m} = UI.cal; m += +d.d; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } UI.cal = {y,m}; render(); },
  openWorkout:d => openWorkoutDetail(d.id),
  delWorkout:d => confirmBox('Supprimer la séance ?', 'Elle sera retirée de l’historique, des records et des statistiques.', 'Supprimer', () => { S.workouts = S.workouts.filter(w => w.id !== d.id); Store.deleteWorkout(d.id); checkPower(true); save(); closeAll(); render(); toast('Séance supprimée.'); }),
  // body
  addBody:() => { const num = id => { const v = parseFloat($(id).value.replace(',','.')); return isNaN(v) ? null : v; };
    const w = toKg($('#bW').value), e = {id:uid(), t:new Date($('#bDate').value + 'T08:00').getTime() || Date.now(), w, f:num('#bF'), waist:num('#bWaist'), chest:num('#bChest'), arm:num('#bArm')};
    if (w == null && e.f == null && e.waist == null && e.chest == null && e.arm == null) { toast('Saisissez au moins une valeur.'); return; }
    S.body.push(e); save(); render(); toast('Mesure enregistrée.'); },
  delBody:d => { S.body = S.body.filter(b => b.id !== d.id); save(); render(); },
  // settings
  setUnit:d => { S.settings.unit = d.u; save(); refreshSheet(); render(); },
  stRest:d => { S.settings.rest = Math.max(15, Math.min(600, S.settings.rest + +d.d)); save(); refreshSheet(); },
  stGoal:d => { S.settings.goal = Math.max(1, Math.min(7, S.settings.goal + +d.d)); checkPower(true); save(); refreshSheet(); render(); },
  stToggle:d => { S.settings[d.k] = !S.settings[d.k]; save(); refreshSheet(); },
  checkUpdate:() => window.fonteCheckUpdate && window.fonteCheckUpdate(true),
  exportData:async () => {
    const data = JSON.stringify({app:'Fonte', version:1, exported:new Date().toISOString(), ...S}, null, 2);
    const filename = 'fonte-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json';
    const dl = window.claude && window.claude.use ? await claude.use('downloads') : null;
    if (!dl) {
      // Standalone app: a plain download link works outside the Claude viewer.
      try { const url = URL.createObjectURL(new Blob([data], {type:'application/json'})); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Sauvegarde exportée.'); }
      catch(e) { toast('Export impossible sur cet appareil.'); }
      return;
    }
    try { await dl.save({filename, data}); toast('Sauvegarde exportée.'); }
    catch(e) { if (e && e.code !== 'declined') toast('Export impossible pour le moment.'); }
  },
  wipe:() => confirmBox('Tout effacer ?', 'Séances, programmes, mesures et exercices perso seront supprimés définitivement.', 'Tout effacer', () => {
    S.workouts.forEach(w => Store.deleteWorkout(w.id)); const st = S.settings; S = DEFAULT(); S.settings = st; Rest.stop(); save(); closeAll(); UI.tab = 'home'; render(); toast('Données effacées.'); }),
};
function defaultName(){ const h = new Date().getHours(); return h < 11 ? 'Séance du matin' : h < 17 ? 'Séance de l’après-midi' : 'Séance du soir'; }

/* ---------- Inputs ---------- */
const IN = {
  wName:v => { S.active.name = v; save(); },
  wNotes:v => { S.active.notes = v; save(); },
  setW:(v,d) => {
    const e = S.active.exercises[+d.e], i = +d.s, src = e.sets[i], w = v.trim() === '' ? null : toKg(v);
    src.w = w; src.auto = false;
    // Copy the load to the following sets that are still empty or were filled automatically.
    if (src.t !== 'w') for (let j = i + 1; j < e.sets.length; j++) { const t = e.sets[j];
      if (t.done || t.t === 'w' || !(t.w == null || t.auto)) continue;
      t.w = w; t.auto = w != null; const inp = document.getElementById('w-' + d.e + '-' + j); if (inp) inp.value = w == null ? '' : dispW(w); }
    save(); },
  setR:(v,d) => { const n = parseInt(v); S.active.exercises[+d.e].sets[+d.s].r = isNaN(n) ? null : n; save(); },
  exNote:(v,d) => { S.active.exercises[+d.e].note = v; save(); },
  exQ:v => { UI.exQ = v; $('#exList').innerHTML = exListHtml(); },
  pickQ:v => { UI.pick.q = v; $('#pickList').innerHTML = pickListHtml(); },
  rName:v => { UI.editR.name = v; },
  rNotes:v => { UI.editR.notes = v; },
  rReps:(v,d) => { UI.editR.exercises[+d.i].reps = v; },
  rW:(v,d) => { UI.editR.exercises[+d.i].w = v.trim() === '' ? null : toKg(v); },
  rRest:(v,d) => { UI.editR.exercises[+d.i].rest = +v; },
  stName:v => { S.settings.name = v; save(); },
  frX:(v,d) => setFrame(mediaKey(d.k), {x:+v}),
  frY:(v,d) => setFrame(mediaKey(d.k), {y:+v}),
  frZ:(v,d) => setFrame(mediaKey(d.k), {z:+v / 100}),
  rmW:v => { UI.rm.w = v; $('#rmOut').innerHTML = rmOut(calcRm()); },
  rmR:v => { UI.rm.r = v; $('#rmOut').innerHTML = rmOut(calcRm()); },
  plT:v => { UI.plate.t = v; $('#plOut').innerHTML = plateOut(); },
  plBar:v => { UI.plate.bar = +v; S.settings.bar = +v; save(); $('#plOut').innerHTML = plateOut(); },
};
function calcRm(){ const w = toKg(UI.rm.w), r = parseInt(UI.rm.r); return w && r ? (r === 1 ? w : (r <= 10 ? (w*(1+r/30) + w*36/(37-r))/2 : w*(1+r/30))) : 0; }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const f = A[el.dataset.a]; if (f) { ev.preventDefault(); f(el.dataset, el, ev); }
});
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.in || el.type === 'file') return;
  const f = IN[el.dataset.in]; if (f) f(el.value, el.dataset);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.in === 'rRest') IN.rRest(el.value, el.dataset);
  if (el.dataset && el.dataset.in === 'plBar') IN.plBar(el.value);
  if (el.dataset && el.dataset.media != null && el.files && el.files[0]) {
    const file = el.files[0], k = mediaKey(el.dataset.media), i = mediaForm(k); el.value = '';
    if (!/^(image|video)\//.test(file.type)) { toast('Choisissez une image, un GIF ou une vidéo.'); return; }
    if (file.size > 60 * 1024 * 1024) { toast('Fichier trop lourd (60 Mo maximum).'); return; }
    Media.write(k, file).then(() => { refreshSheet(); render(); toast((typeof k === 'string' ? 'Animation' : 'Image') + ' ajoutée à ' + FORMS[i].n + '.'); }).catch(e => toast(mediaError(e)));
    return;
  }
  if (el.id === 'packFile' && el.files && el.files[0]) {
    const file = el.files[0]; el.value = '';
    if (/^(image|video)\//.test(file.type) || /\.(gif|png|jpe?g|webp|heic|mp4|mov|webm)$/i.test(file.name)) { chooseMediaSlot(file); return; }
    file.text().then(async txt => {
      let pack; try { pack = JSON.parse(txt); } catch(e) { throw new Error('format'); }
      if (!pack || pack.app !== 'Fonte-pack' || !Array.isArray(pack.media)) throw new Error('format');
      let n = 0;
      for (const m of pack.media) {
        const bin = atob(m.data), bytes = new Uint8Array(bin.length);
        for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
        await Media.write(m.slot === 'anim' ? 'a' + m.form : +m.form, new Blob([bytes], {type:m.type}));
        n++;
      }
      refreshSheet(); render(); toast(n + ' visuel' + (n>1?'s':'') + ' importé' + (n>1?'s':'') + '.');
    }).catch(e => toast(e && e.message === 'format' ? 'Ce fichier n’est pas un pack Fonte (fonte-pack.json).' : mediaError(e)));
    return;
  }
  if (el.id === 'importFile' && el.files && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !Array.isArray(d.workouts)) throw 0;
        confirmBox('Importer cette sauvegarde ?', `${d.workouts.length} séance(s) et ${(d.routines||[]).length} programme(s). Vos données actuelles seront remplacées.`, 'Importer', () => {
          S.workouts.forEach(w => Store.deleteWorkout(w.id)); S = normalize(d); S.workouts.forEach(w => Store.saveWorkout(w)); save(); closeAll(); render(); toast('Sauvegarde importée.'); }, false);
      } catch(e) { toast('Fichier illisible : choisissez un export JSON de Fonte.'); } };
    r.readAsText(el.files[0]); el.value = '';
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && sheets.length) closeSheet();
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('sinp')) ev.target.blur();
});

/* ---------- Clock ---------- */
setInterval(() => { if (!S.active) return; const s = (Date.now() - S.active.start)/1000; const a = $('#wElapsed'), b = $('#homeElapsed'); if (a) a.textContent = fmtClock(s); if (b) b.textContent = fmtClock(s); }, 1000);

/* ---------- Boot ---------- */
const VIEWS = {home:vHome, routines:vRoutines, workout:vWorkout, exercises:vExercises, progress:vProgress};
S = normalize(Store.readLocal());
if (S.active) UI.tab = 'workout';
render();
checkPower();
Media.load().then(() => { if (Object.keys(Media.urls).length) render(); });
Store.connect();
</script>

<script>
window.FONTE_VERSION = '20261109225703';
// Offline support: cache the app so it opens without network.
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
// Ask the browser not to evict the workout log when space runs low.
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
// Updates: compare with the published version on launch and whenever the app comes back to the screen.
let lastCheck = 0;
window.fonteCheckUpdate = async (manual) => {
  if (!manual && Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    const v = (await r.json()).version;
    if (v && v !== window.FONTE_VERSION) {
      if (typeof toast === 'function') toast('Mise à jour en cours…');
      try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch(e) {}
      try { sessionStorage.setItem('fonte-updated', v); } catch(e) {}
      setTimeout(() => location.reload(), 600);
    } else if (manual && typeof toast === 'function') toast('Vous avez la dernière version.');
  } catch(e) { if (manual && typeof toast === 'function') toast('Pas de réseau : impossible de vérifier pour le moment.'); }
};
window.addEventListener('load', () => {
  try { if (sessionStorage.getItem('fonte-updated')) { sessionStorage.removeItem('fonte-updated'); setTimeout(() => typeof toast === 'function' && toast('Fonte a été mise à jour.'), 400); } } catch(e) {}
  window.fonteCheckUpdate();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') window.fonteCheckUpdate(); });
</script>
</body>
